   <g id="text_1">
    <text style="font-weight: 600; font-size: 9px; font-family: 'Arial', sans-serif; text-anchor: start; fill: #20242a" x="40.50144" y="94.657417" transform="rotate(-0 40.50144 94.657417)">1  State the claim</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8px; font-family: 'Arial', sans-serif; fill: #20242a" transform="translate(40.50144 113.540784)">Population identity, developmental order,</text>
    <text style="font-size: 8px; font-family: 'Arial', sans-serif; fill: #20242a" transform="translate(40.50144 123.241284)">or donor-variable organisation</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 600; font-size: 9px; font-family: 'Arial', sans-serif; text-anchor: start; fill: #20242a" x="40.50144" y="186.254478" transform="rotate(-0 40.50144 186.254478)">2  Check reference consistency</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8px; font-family: 'Arial', sans-serif; fill: #20242a" transform="translate(40.50144 205.169439)">Check roots, lineages and finite-cell coverage.</text>
    <text style="font-size: 8px; font-family: 'Arial', sans-serif; fill: #20242a" transform="translate(40.50144 215.006439)">Separate reversal from reordered distances.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 600; font-size: 9px; font-family: 'Arial', sans-serif; text-anchor: start; fill: #20242a" x="40.50144" y="277.855758" transform="rotate(-0 40.50144 277.855758)">3  Choose an analytical representation</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8px; font-family: 'Arial', sans-serif; fill: #20242a" transform="translate(40.50144 296.721969)">PCA/GLM-PCA baseline; suitable count-model latents.</text>
    <text style="font-size: 8px; font-family: 'Arial', sans-serif; fill: #20242a" transform="translate(40.50144 306.465219)">Choose dimension; keep the 2D display separate.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 600; font-size: 9px; font-family: 'Arial', sans-serif; text-anchor: start; fill: #20242a" x="40.50144" y="369.461257" transform="rotate(-0 40.50144 369.461257)">4  Check the task outcome</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8px; font-family: 'Arial', sans-serif; fill: #20242a" transform="translate(40.50144 388.288249)">Per-label F1, order agreement, or cell-type</text>
    <text style="font-size: 8px; font-family: 'Arial', sans-serif; fill: #20242a" transform="translate(40.50144 398.125249)">and donor information reported separately.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 600; font-size: 9px; font-family: 'Arial', sans-serif; text-anchor: start; fill: #20242a" x="40.50144" y="461.058318" transform="rotate(-0 40.50144 461.058318)">5  Check stability</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8px; font-family: 'Arial', sans-serif; fill: #20242a" transform="translate(40.50144 479.994654)">Vary dimension, graph, seed and reference.</text>
    <text style="font-size: 8px; font-family: 'Arial', sans-serif; fill: #20242a" transform="translate(40.50144 489.695154)">Track the task outcome and diagnostic together.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 600; font-size: 9px; font-family: 'Arial', sans-serif; text-anchor: start; fill: #20242a" x="40.50144" y="552.677176" transform="rotate(-0 40.50144 552.677176)">6  Interpret or withhold</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8px; font-family: 'Arial', sans-serif; fill: #20242a" transform="translate(40.50144 571.642809)">Report conditional support, reference dependence,</text>
    <text style="font-size: 8px; font-family: 'Arial', sans-serif; fill: #20242a" transform="translate(40.50144 581.249559)">representation discrepancy or an indeterminate result.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 600; font-size: 8px; font-family: 'Arial', sans-serif; text-anchor: middle; fill: #20242a" x="436.7664" y="179.70189" transform="rotate(-0 436.7664 179.70189)">Reference uncertain</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8px; font-family: 'Arial', sans-serif; fill: #20242a" transform="translate(398.0814 200.432556)">Reassess the anchor;</text>
    <text style="font-size: 8px; font-family: 'Arial', sans-serif; fill: #20242a" transform="translate(393.182025 209.466681)">withhold an unsupported</text>
    <text style="font-size: 8px; font-family: 'Arial', sans-serif; fill: #20242a" transform="translate(406.9789 218.500806)">directional claim.</text>
   </g>
   <g id="text_15">
    <text style="font-size: 8px; font-family: 'Arial', sans-serif; text-anchor: middle; fill: #20242a" x="356.9895" y="187.4883" transform="rotate(-0 356.9895 187.4883)">uncertain</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 600; font-size: 8px; font-family: 'Arial', sans-serif; text-anchor: middle; fill: #20242a" x="436.7664" y="362.9532" transform="rotate(-0 436.7664 362.9532)">Outcome unsupported</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8px; font-family: 'Arial', sans-serif; fill: #20242a" transform="translate(394.963275 383.636991)">Change representation;</text>
    <text style="font-size: 8px; font-family: 'Arial', sans-serif; fill: #20242a" transform="translate(393.6364 392.764866)">check the task outcome,</text>
    <text style="font-size: 8px; font-family: 'Arial', sans-serif; fill: #20242a" transform="translate(401.645775 401.798991)">or narrow the claim.</text>
   </g>
   <g id="text_18">
    <text style="font-size: 8px; font-family: 'Arial', sans-serif; text-anchor: middle; fill: #20242a" x="356.9895" y="370.69086" transform="rotate(-0 356.9895 370.69086)">not met</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 600; font-size: 8px; font-family: 'Arial', sans-serif; text-anchor: middle; fill: #20242a" x="436.7664" y="454.50573" transform="rotate(-0 436.7664 454.50573)">Conclusion unstable</text>
   </g>
   <g id="text_20">
    <text style="font-size: 8px; font-family: 'Arial', sans-serif; fill: #20242a" transform="translate(398.53015 475.189521)">Report the sensitivity;</text>
    <text style="font-size: 8px; font-family: 'Arial', sans-serif; fill: #20242a" transform="translate(396.082025 484.317396)">reassess the reference</text>
    <text style="font-size: 8px; font-family: 'Arial', sans-serif; fill: #20242a" transform="translate(399.1964 493.351521)">or withhold the claim.</text>
   </g>
   <g id="text_21">
    <text style="font-size: 8px; font-family: 'Arial', sans-serif; text-anchor: middle; fill: #20242a" x="356.9895" y="462.29214" transform="rotate(-0 356.9895 462.29214)">unstable</text>
   </g>
  </g>
  <g id="text_22">
   <text style="font-size: 8.5px; font-family: 'Arial', sans-serif; text-anchor: middle; fill: #20242a" x="252" y="22.7664" transform="rotate(-0 252 22.7664)">Conceptual model; not a quantitative measurement.</text>
  </g>
  <g id="text_23">
   <text style="font-size: 8px; font-family: 'Arial', sans-serif; text-anchor: middle; fill: #20242a" x="252" y="651.5208" transform="rotate(-0 252 651.5208)">No fitted result, method ranking or universal reliability threshold is shown.</text>
  </g>
 </g>
